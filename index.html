<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Verdana, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* Header Section */
        header {
            width: 100%;
            padding: 60px 20px;
            background: linear-gradient(135deg, #4a90e2, #0072ff);
            color: white;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: bold;
        }

        header p {
            margin-top: 10px;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Button */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: white;
            color: #0072ff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn:hover {
            background: #e6e6e6;
        }

        /* Content Section */
        .section {
            padding: 40px 20px;
            max-width: 900px;
            margin: auto;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }

        .section h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #0072ff;
        }

        .section p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
        }

        /* Footer */
        footer {
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
            background: #333;
            color: white;
            margin-top: 40px;
        }
